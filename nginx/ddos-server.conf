# =====================================================================
#  Chống DDoS tầng HTTP - PHẦN SERVER CONTEXT
#  Cài tại: /etc/nginx/snippets/ddos-server.conf
#  Rồi thêm vào trong block server { } của bạn:
#      include snippets/ddos-server.conf;
# =====================================================================

# --- Chống Slowloris: cắt client gửi header/body quá chậm
client_body_timeout   10s;
client_header_timeout 10s;
send_timeout          15s;
reset_timedout_connection on;

# --- Giữ kết nối ngắn để giải phóng worker nhanh khi bị flood
keepalive_timeout  20s;
keepalive_requests 200;

# --- Giới hạn kích thước request (chống POST rác / upload lớn)
client_max_body_size 16m;
large_client_header_buffers 4 8k;

# --- Rate limit & connection limit cho toàn site
limit_req  zone=perip burst=40 nodelay;
limit_conn addr 30;

# --- Chặn user-agent rỗng / scanner phổ biến (tuỳ chỉnh)
if ($http_user_agent = "") { return 444; }

# --- Ví dụ cho endpoint nhạy cảm (login/API) đặt trong location:
# location = /login {
#     limit_req zone=perip_strict burst=5 nodelay;
#     proxy_pass http://app;
# }
