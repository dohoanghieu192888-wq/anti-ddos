# =====================================================================
#  Rate limit tầng HTTP (nginx) - PHẦN HTTP CONTEXT
#  Cài tại: /etc/nginx/conf.d/00-ddos-http.conf
#  (Ubuntu đã include sẵn /etc/nginx/conf.d/*.conf trong block http)
#
#  Phải nằm trong block http - các zone này dùng chung cho mọi server.
# =====================================================================

# Giới hạn request theo IP: tối đa 20 req/giây (zone 20MB ~ 320k IP)
limit_req_zone $binary_remote_addr zone=perip:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=perip_strict:10m rate=5r/s;
# Giới hạn số kết nối đồng thời theo IP
limit_conn_zone $binary_remote_addr zone=addr:20m;

# Trả 429 thay vì 503 (dễ phân biệt bị rate limit với server lỗi)
limit_req_status 429;
limit_conn_status 429;

# Ghi log riêng các IP bị chặn để fail2ban xử lý
limit_req_log_level warn;
limit_conn_log_level warn;
