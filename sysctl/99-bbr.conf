# =====================================================================
#  BBR congestion control + fq qdisc (kernel 5.4 hỗ trợ sẵn)
#  Cài tại: /etc/sysctl.d/99-bbr.conf
#  Chỉ dùng khi modprobe tcp_bbr thành công (install.sh kiểm tra).
# =====================================================================
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
